name: Public availability
on:
  workflow_dispatch:
  schedule:
    - cron: '40 21 * * *'
permissions:
  contents: read
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public pages, assets and API validation
        shell: bash
        run: |
          if node check.mjs; then exit 0; fi
          sleep 10
          node check.mjs
